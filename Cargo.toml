[workspace]
resolver = "2"
members = [
    "crates/iroh-drop",
    "crates/iroh-drop-sdk",
    "crates/iroh-drop-daemon",
    "crates/iroh-drop-cli",
    "crates/iroh-drop-gui",
    "crates/iroh-drop-web",
    "crates/iroh-drop-presence",
]
# crates/iroh-drop/fuzz is a standalone cargo-fuzz workspace (its own
# [workspace] table), built on nightly — never part of this build.

[workspace.dependencies]
iroh = "1.0.3"
iroh-blobs = "0.103.0"
iroh-gossip = "0.101.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
postcard = "1"
bytes = "1"
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
iroh-drop-sdk = { path = "crates/iroh-drop-sdk" }
