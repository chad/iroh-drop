[package]
name = "iroh-drop-web"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "wasm-bindgen bindings for running iroh-drop in the browser (relay-only)"

# cdylib for wasm-pack; rlib so `cargo check -p iroh-drop-web` works natively.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
iroh-drop = { path = "../iroh-drop" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
console_error_panic_hook = "0.1"
tokio = { version = "1", default-features = false, features = ["sync"] }
